name: Guto Bot backend tests
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/guto-backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/guto-backend-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
