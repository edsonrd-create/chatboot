# Guto Bot: DEMONSTRACAO GRATIS, SEM DADOS REAIS.
# Render Free hiberna e perde arquivos. NUNCA use para atendimento de clientes.
services:
  - type: web
    name: guto-bot-previa-gratis
    runtime: docker
    plan: free
    branch: feature/guto-bot-nativo-meta-v2
    autoDeployTrigger: off
    dockerContext: ./native
    dockerfilePath: ./native/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '8080'
      - key: DATA_FILE
        value: /app/data/state.json
      - key: FREE_PREVIEW_MODE
        value: 'true'
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PDV_ALLOWED_HOSTS
        value: pdvgutoexpress.com.br
