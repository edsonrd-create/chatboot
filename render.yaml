# Guto Bot Nativo — ambiente de HOMOLOGACAO, nao producao.
# Plano Starter com disco persistente tem custo mensal. Confirmar no Render antes de criar.
# Nao cadastrar tokens de clientes / Meta / IA neste repositorio publico.
services:
  - type: web
    name: guto-bot-nativo-homologacao
    runtime: docker
    plan: starter
    region: ohio
    numInstances: 1
    branch: feature/guto-bot-nativo-meta-v2
    autoDeployTrigger: off
    dockerContext: ./native
    dockerfilePath: ./native/Dockerfile
    healthCheckPath: /health
    disk:
      name: guto-bot-homologacao-dados
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: '8080'
      - key: DATA_FILE
        value: /app/data/state.json
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PDV_ALLOWED_HOSTS
        value: pdvgutoexpress.com.br
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
